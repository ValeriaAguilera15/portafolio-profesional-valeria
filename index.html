<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valeria | Portafolio Profesional</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">VALERIA</a>
        </div>
    </nav>

    <header class="py-5 text-center bg-white border-bottom">
        <div class="container">
            <h1 class="display-4 fw-bold">Ingeniería en Computación</h1>
            <p class="lead text-muted">Estudiante de último semestre | UNEG</p>
        </div>
    </header>

    <section id="contacto" class="container py-5">
        <div class="text-center mb-5">
            <p class="text-uppercase fw-bold text-primary small">Get In Touch</p>
            <h2 class="display-5 fw-bold">Contact me</h2>
            <p class="text-muted">¿Tienes un proyecto en mente? ¡Hablemos!</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <form class="row g-3 shadow-sm p-4 bg-white rounded border">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">First name</label>
                        <input type="text" class="form-control" placeholder="Tu nombre">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Last name</label>
                        <input type="text" class="form-control" placeholder="Tu apellido">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control" placeholder="nombre@ejemplo.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Phone number</label>
                        <input type="tel" class="form-control" placeholder="+58...">
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Choose a topic</label>
                        <select class="form-select">
                            <option selected disabled>Select one...</option>
                            <option>Desarrollo Web</option>
                            <option>Diseño UI/UX</option>
                            <option>Social Media</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold">Message</label>
                        <textarea class="form-control" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="terms">
                            <label class="form-check-label text-muted" for="terms">I accept the terms</label>
                        </div>
                    </div>

                    <div class="col-12 text-center">
                        <button type="submit" class="btn btn-primary px-5 py-2 fw-bold btn-custom">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
