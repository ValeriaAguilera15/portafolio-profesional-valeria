<section id="contacto" class="container py-5">
    <div class="text-center mb-5">
        <p class="text-uppercase fw-bold text-muted small">Get In Touch</p>
        <h2 class="display-5 fw-bold">Contact me</h2>
        <p class="text-muted">¿Tienes un proyecto en mente? ¡Hablemos!</p>
    </div>

    <form class="row g-3 shadow-sm p-4 bg-white rounded">
        <div class="col-md-6">
            <label class="form-label">First name</label>
            <input type="text" class="form-control" placeholder="Tu nombre">
        </div>
        <div class="col-md-6">
            <label class="form-label">Last name</label>
            <input type="text" class="form-control" placeholder="Tu apellido">
        </div>

        <div class="col-md-6">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" placeholder="nombre@ejemplo.com">
        </div>
        <div class="col-md-6">
            <label class="form-label">Phone number</label>
            <input type="tel" class="form-control" placeholder="+58...">
        </div>

        <div class="col-12">
            <label class="form-label">Choose a topic</label>
            <select class="form-select">
                <option selected disabled>Select one...</option>
                <option>Desarrollo Web</option>
                <option>Diseño UI/UX</option>
                <option>Social Media</option>
            </select>
        </div>

        <div class="col-12">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>

        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="terms">
                <label class="form-check-label" for="terms">I accept the terms</label>
            </div>
        </div>

        <div class="col-12 text-center">
            <button type="submit" class="btn btn-primary px-5 py-2 btn-custom">Submit</button>
        </div>
    </form>
</section>
